<style>
@font-face {
font-family: 'SentyCreamPuff';
src: url('https://cdn.jsdelivr.net/gh/nickymartorell/fonts@main/SentyCreamPuff.woff2') format('woff2'),
url('https://cdn.jsdelivr.net/gh/nickymartorell/fonts@main/SentyCreamPuff.woff') format('woff');
font-weight: normal;
font-style: normal;
font-display: swap;
}
</style>
<style>
:root {
--bg-primary: #2A0031;
--bg-secondary: #1a0020;
--accent: #FF6B6B;
--accent-dark: #E05555;
--text-dark: #ffffff;
--outline: #ffffff;
--bin-yellow: #FFD93D;
--bin-dark: #0a0a0a;
}
.dark {
--bg-primary: #2A0031;
--bg-secondary: #1a0020;
--accent: #FF6B6B;
--accent-dark: #E05555;
--text-dark: #ffffff;
--outline: #ffffff;
--bin-yellow: #FFD93D;
--bin-dark: #0a0a0a;
}
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}
html, body {
max-width: 100vw;
overflow-x: hidden;
}
body {
font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
background: #2A0031;
min-height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
padding: 12px 8px;
transition: background 0.3s ease;
}
.container {
max-width: 600px;
width: 100%;
display: flex;
flex-direction: column;
align-items: center;
gap: 16px;
}
.subtitle {
color: var(--text-dark);
font-size: 1.1rem;
text-align: center;
opacity: 0.8;
}
/* Text input area */
.input-container {
width: 100%;
max-width: 500px;
position: relative;
}
textarea {
width: 100%;
min-height: 120px;
background: #3a0045;
border: 3px solid #2DE897;
border-radius: 12px;
padding: 16px;
padding-bottom: 32px;
font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
font-size: 18px;
color: var(--text-dark);
resize: vertical;
}
textarea::placeholder {
color: #888;
font-style: italic;
}
textarea:focus {
outline: none;
border-color: #2DE897;
box-shadow: 0 0 20px rgba(45, 232, 151, 0.3);
}
.submit-btn {
width: 32px;
height: 32px;
min-width: 32px;
border-radius: 50%;
background: linear-gradient(180deg, #FFE566 0%, #2DE897 100%);
border: none;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
transition: all 0.2s ease;
box-shadow: 0 2px 8px rgba(45, 232, 151, 0.4);
}
.submit-btn:hover {
transform: scale(1.1);
box-shadow: 0 4px 12px rgba(255, 229, 102, 0.5);
}
.submit-btn:active {
transform: scale(0.95);
}
.submit-btn:disabled {
opacity: 0.5;
cursor: not-allowed;
transform: none;
}
.submit-btn svg {
width: 16px;
height: 16px;
fill: white;
}
@keyframes fadeIn {
from { opacity: 0; transform: translateY(20px); }
to { opacity: 1; transform: translateY(0); }
}
/* Canvas for generation */
#generatorCanvas {
display: none;
}
/* Counter display */
.counter-display {
background: rgba(255, 255, 255, 0.1);
border: 2px solid #2DE897;
border-radius: 20px;
padding: 8px 20px;
color: #2DE897;
font-size: 0.9rem;
font-weight: 600;
display: flex;
align-items: center;
gap: 8px;
}
.counter-display .count {
font-size: 1.2rem;
color: #FFD93D;
}
.header-image {
max-width: 400px;
width: 100%;
height: auto;
}
.recycle-row {
position: absolute;
bottom: 8px;
left: 10px;
right: 10px;
display: flex;
align-items: center;
justify-content: space-between;
gap: 8px;
}
.recycle-note {
font-size: 0.75rem;
color: #2DE897;
font-weight: 500;
}
.recycle-note .blink {
animation: blink 1s ease-in-out infinite;
}
@keyframes blink {
0%, 100% { opacity: 1; }
50% { opacity: 0.3; }
}
/* Image fade in animation */
@keyframes imageFadeIn {
from { opacity: 0; transform: scale(0.95); }
to { opacity: 1; transform: scale(1); }
}
@keyframes explorePulse {
0%, 100% { box-shadow: 0 4px 14px rgba(250, 175, 64, 0.5); transform: scale(1); }
50% { box-shadow: 0 4px 22px rgba(250, 175, 64, 0.8); transform: scale(1.04); }
}
.image-fade-in {
animation: imageFadeIn 0.5s ease-out forwards;
}
/* ===== Loading overlay for AI generation ===== */
.loading-overlay {
display: none;
position: relative;
width: 100%;
max-width: 600px;
min-height: 200px;
border-radius: 16px;
background: rgba(42, 0, 49, 0.7);
backdrop-filter: blur(6px);
flex-direction: column;
align-items: center;
justify-content: center;
gap: 16px;
padding: 40px 20px;
}
.loading-overlay.active {
display: flex;
}
.loading-spinner {
width: 48px;
height: 48px;
position: relative;
}
.loading-spinner::before,
.loading-spinner::after {
content: '✦';
position: absolute;
font-size: 24px;
animation: spinStar 1.4s ease-in-out infinite;
}
.loading-spinner::before {
top: 0; left: 12px;
color: #FFD93D;
animation-delay: 0s;
}
.loading-spinner::after {
top: 18px; left: 0;
color: #2DE897;
animation-delay: 0.3s;
}
.loading-spinner-third {
position: absolute;
top: 18px; left: 24px;
font-size: 24px;
color: #FF4CBC;
animation: spinStar 1.4s ease-in-out infinite;
animation-delay: 0.6s;
}
@keyframes spinStar {
0%   { opacity: 0.3; transform: scale(0.5) rotate(0deg); }
50%  { opacity: 1;   transform: scale(1.3) rotate(180deg); }
100% { opacity: 0.3; transform: scale(0.5) rotate(360deg); }
}
.loading-text {
color: #fff;
font-size: 15px;
font-weight: 600;
letter-spacing: 0.5px;
text-align: center;
animation: loadingPulse 1.5s ease-in-out infinite;
}
@keyframes loadingPulse {
0%, 100% { opacity: 0.7; }
50% { opacity: 1; }
}
.explore-spin {
display: inline-block;
animation: spinStar 0.8s linear infinite;
}
/* Mockup card styles */
.mockup-card {
flex: 0 0 auto;
width: 170px;
scroll-snap-align: center;
background: #fff;
border-radius: 14px;
padding: 10px;
transition: transform 0.2s ease;
}
.mockup-card:hover {
transform: translateY(-3px);
}
.mockup-preview {
width: 150px;
height: 180px;
background: #f5f5f5;
border-radius: 10px;
position: relative;
overflow: hidden;
}
.mockup-design {
position: absolute;
height: auto;
border-radius: 4px;
pointer-events: none;
}
.mockup-title {
margin-top: 8px;
font-weight: bold;
color: #333;
font-size: 13px;
}
.mockup-price {
color: #FF4757;
font-size: 12px;
font-weight: 600;
margin-top: 2px;
}
#mockupCarousel::-webkit-scrollbar {
display: none;
}
/* Tooltip on hover for toolbar buttons */
[title] {
position: relative;
}
/* Left toolbar tooltips - appear to the right */
.transform-left-col .toggle-btn:hover::after,
.transform-left-col .layer-btn:hover::after,
.transform-left-col .font-arrow-btn:hover::after,
.transform-left-col .line-btn:hover::after,
.transform-left-col .align-btn:hover::after {
content: attr(title);
position: absolute;
left: 120%;
top: 50%;
transform: translateY(-50%);
background: rgba(0,0,0,0.95);
color: #FAAF40;
font-size: 10px;
font-weight: 600;
padding: 4px 8px;
border-radius: 6px;
white-space: nowrap;
z-index: 9999;
pointer-events: none;
border: 1px solid rgba(250,175,64,0.3);
animation: fadeIn 0.15s ease;
}
/* Right toolbar tooltips - appear to the left */
.transform-right-col .toggle-btn:hover::after,
.transform-right-col .layer-btn:hover::after,
.transform-right-col .font-arrow-btn:hover::after,
.transform-right-col .line-btn:hover::after,
.transform-right-col .align-btn:hover::after {
content: attr(title);
position: absolute;
right: 120%;
left: auto;
top: 50%;
transform: translateY(-50%);
background: rgba(0,0,0,0.95);
color: #FAAF40;
font-size: 10px;
font-weight: 600;
padding: 4px 8px;
border-radius: 6px;
white-space: nowrap;
z-index: 9999;
pointer-events: none;
border: 1px solid rgba(250,175,64,0.3);
animation: fadeIn 0.15s ease;
}
/* Ensure toolbar columns sit above canvas for tooltips */
.transform-left-col, .transform-right-col {
z-index: 10;
position: relative;
}
#transformRestart:hover {
transform: scale(1.12);
transition: transform 0.15s ease;
}
</style>

</head>
<body>
<div class="container">
<div class="counter-display">
Total of Trash Talk "Recycled": <span class="count" id="trashCounter">0</span>
</div>
<img src="https://pfst.cf2.poecdn.net/base/image/1430260ac99ff653787186cf273d86e87ea24070bf60bc77c98edc36437a7368?w=3517&amp;h=1148" alt="Drop Your Trash Talk" class="header-image">
<div class="input-container">
<textarea id="trashText" placeholder="let your trash talk recycle into treasure talk ♻️"></textarea>
<div class="recycle-row"><span class="recycle-note">Recycle your trash talk to treasure <span class="blink">✨</span><span class="blink" style="animation-delay: 0.2s">✨</span></span><div style="display:flex;gap:6px;align-items:center;"><button class="submit-btn" id="generateBtn" title="Submit"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M4 12l1.41 1.41L11 7.83V20h2V7.83l5.58 5.59L20 12l-8-8-8 8z" transform="rotate(90 12 12)"></path></svg></button></div></div>
</div>
<div class="loading-overlay" id="aiLoadingOverlay">
<div class="loading-spinner">
<span class="loading-spinner-third">✦</span>
</div>
<div class="loading-text">✨ Recycling your trash talk✨</div>
</div>
<img id="emptySpaceImage" src="assets/empty-space-2.png" alt="Trash Talk Bins" style="max-width: 300px; width: 80%; height: auto; margin-top: 10px;">
<div id="transformSection" style="display: none; width: 100%; max-width: 100%; animation: fadeIn 0.5s ease;">
<div style="display: flex; align-items: stretch; gap: 2px; margin-bottom: 3px; width: 100%; overflow: hidden;">
<div class="transform-left-col" style="display: flex; flex-direction: column; align-items: center; justify-content: flex-start; background: #1a0020; border-radius: 6px;">
<span class="bar-title-sm">LAYER</span>
<div id="layerSelector" style="display: flex; flex-direction: column; gap: 3px;">
<button class="layer-btn active" data-layer="front" style="border-radius: 50%; border: 1px solid #EFB257; background: #6b4d7a; color: #fff; cursor: pointer; font-weight: bold; font-size: 9px; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; padding: 0;" title="Place text in front of image">F</button>
<button class="layer-btn" data-layer="behind" style="border-radius: 50%; border: 1px solid #555; background: #6b4d7a; color: #fff; cursor: pointer; font-weight: bold; font-size: 9px; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; padding: 0;" title="Place text behind image">B</button>
</div>
<span class="bar-title-sm">MSG</span>
<button id="toggleOrigMsgBtn" class="toggle-btn" data-active="false" style="border-radius: 50%; border: 1px solid #555; background: #6b4d7a; color: #fff; cursor: pointer; font-weight: bold; font-size: 9px; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; padding: 0;" title="Show/hide your original message on card">✉</button>
<span class="bar-title-sm">STROKE</span>
<button id="toggleStrokeBtn" class="toggle-btn" data-active="false" style="border-radius: 50%; border: 1px solid #555; background: #6b4d7a; color: #fff; cursor: pointer; font-weight: bold; font-size: 9px; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; padding: 0;" title="Add white outline around text">S</button>
<span class="bar-title-sm">COLOR</span>
<button id="randomColorBtn" class="font-arrow-btn" style="border-radius: 50%; border: 1px solid #FF4CBC; background: #6b4d7a; color: #FF4CBC; cursor: pointer; font-weight: bold; font-size: 11px; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; padding: 0;" title="Cycle text color mode">🎨</button>
<span class="bar-title-sm">ROTATE</span>
<input type="range" id="transformRotation" min="-180" max="180" value="0" class="vertical-slider" style="writing-mode: vertical-lr; direction: rtl; width: 10px;">
<span id="tRotationVal" class="bar-value">0°</span>
<span class="bar-title-sm">FONT<br>SIZE</span>
<input type="range" id="transformFontScale" min="100" max="150" value="115" class="vertical-slider" style="writing-mode: vertical-lr; direction: rtl; width: 10px;">
<span id="tFontScaleVal" class="bar-value">115%</span>
</div>
<div id="transformImageContainer" style="flex: 1; min-width: 0; background: #1a0020; border-radius: 6px; padding: 6px;">
<canvas id="transformCanvas" style="width: 100%; border-radius: 8px;"></canvas>
<!-- Image Filter Panel -->
<div id="filterPanel" style="margin-top: 6px; background: rgba(30,5,40,0.85); border-radius: 8px; padding: 6px 8px; border: 1px solid rgba(239,178,87,0.15);">
<div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;">
<span style="font-size: 0.65rem; color: #FAAF40; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;">Filters</span>
<button id="filterResetBtn" style="background: none; border: 1px solid #555; color: #aaa; font-size: 0.55rem; padding: 1px 6px; border-radius: 10px; cursor: pointer; transition: all 0.2s;" title="Reset all filters to default">Reset</button>
</div>
<div id="filterPresets" style="display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px;">
<button class="filter-preset active" data-filter="none" style="background: #6b4d7a; border: 1px solid #FF4CBC; color: #fff; font-size: 0.55rem; padding: 2px 7px; border-radius: 10px; cursor: pointer; transition: all 0.2s; white-space: nowrap;" title="No filter applied">None</button>
<button class="filter-preset" data-filter="bw" style="background: #6b4d7a; border: 1px solid #555; color: #fff; font-size: 0.55rem; padding: 2px 7px; border-radius: 10px; cursor: pointer; transition: all 0.2s; white-space: nowrap;" title="Black & white monochrome">B&W</button>
<button class="filter-preset" data-filter="sepia" style="background: #6b4d7a; border: 1px solid #555; color: #fff; font-size: 0.55rem; padding: 2px 7px; border-radius: 10px; cursor: pointer; transition: all 0.2s; white-space: nowrap;" title="Warm sepia tone">Sepia</button>
<button class="filter-preset" data-filter="vintage" style="background: #6b4d7a; border: 1px solid #555; color: #fff; font-size: 0.55rem; padding: 2px 7px; border-radius: 10px; cursor: pointer; transition: all 0.2s; white-space: nowrap;" title="Vintage faded look">Vintage</button>
<button class="filter-preset" data-filter="warm" style="background: #6b4d7a; border: 1px solid #555; color: #fff; font-size: 0.55rem; padding: 2px 7px; border-radius: 10px; cursor: pointer; transition: all 0.2s; white-space: nowrap;" title="Warm golden tone">Warm</button>
<button class="filter-preset" data-filter="cool" style="background: #6b4d7a; border: 1px solid #555; color: #fff; font-size: 0.55rem; padding: 2px 7px; border-radius: 10px; cursor: pointer; transition: all 0.2s; white-space: nowrap;" title="Cool blue tint">Cool</button>
<button class="filter-preset" data-filter="vivid" style="background: #6b4d7a; border: 1px solid #555; color: #fff; font-size: 0.55rem; padding: 2px 7px; border-radius: 10px; cursor: pointer; transition: all 0.2s; white-space: nowrap;" title="Vivid high saturation">Vivid</button>
<button class="filter-preset" data-filter="fade" style="background: #6b4d7a; border: 1px solid #555; color: #fff; font-size: 0.55rem; padding: 2px 7px; border-radius: 10px; cursor: pointer; transition: all 0.2s; white-space: nowrap;" title="Soft faded pastel">Fade</button>
<button class="filter-preset" data-filter="drama" style="background: #6b4d7a; border: 1px solid #555; color: #fff; font-size: 0.55rem; padding: 2px 7px; border-radius: 10px; cursor: pointer; transition: all 0.2s; white-space: nowrap;" title="High contrast dramatic">Drama</button>
</div>
<div id="filterSliders" style="display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px;">

<span style="font-size: 0.5rem; color: #ccc; min-width: 28px;">BRT</span>

<span id="filterBrtVal" style="font-size: 0.45rem; color: #FF4CBC; min-width: 24px; text-align: right;">100</span>

<span id="filterCtrVal" style="font-size: 0.45rem; color: #FF4CBC; min-width: 24px; text-align: right;">100</span>

</div>
</div>

</button>

</button>

document.body.appendChild(d);
});
